<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Guilherme Bernardo</title>
  <style>
    .gb-fav-dot{transform-box:fill-box;transform-origin:center;animation:gb-fav-pulse 2.2s ease-in-out infinite}
    @keyframes gb-fav-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}
    @media (prefers-reduced-motion:reduce){
      .gb-fav-dot{animation:none}
    }
  </style>
  <circle class="gb-fav-dot" cx="16" cy="16" r="14" fill="#0ACF83"/>
</svg>
