<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Guilherme Bernardo</title>
  <style>
    .gb-fav-wave{transform-box:fill-box;transform-origin:center;animation:gb-fav-wave 2.2s ease-out infinite}
    .gb-fav-dot{animation:gb-fav-blink 2.2s ease-in-out infinite}
    @keyframes gb-fav-wave{0%{transform:scale(1);opacity:.65}70%,100%{transform:scale(3.2);opacity:0}}
    @keyframes gb-fav-blink{0%,100%{opacity:1}55%{opacity:.45}}
    @media (prefers-reduced-motion:reduce){
      .gb-fav-wave{animation:none;opacity:0}
      .gb-fav-dot{animation:none;opacity:1}
    }
  </style>
  <rect width="32" height="32" fill="#000000"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#0ACF83" stroke-opacity="0.55" stroke-width="1.8"/>
  <circle class="gb-fav-wave" cx="16" cy="16" r="3" fill="#0ACF83"/>
  <circle class="gb-fav-dot" cx="16" cy="16" r="3" fill="#0ACF83"/>
</svg>
